[package]
name = "ff"
version = "0.2.0"
edition = "2024"
[dependencies]
# error handling / serialization
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
getrandom = "0.4.2"

# index, search, db
redb = "4.2"
parking_lot = "0.12.5"
rayon = "1.12"
memchr = "2.8.3"
regex = "1.13"

# tui + platform
ratatui = "0.30.2"
arboard = "3.7"
open = "5.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
egui = "0.37.0"
eframe = "0.37.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
